version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixlo_newsletter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixlo_newsletter_db
      POSTGRES_USER: pixlo_user
      POSTGRES_PASSWORD: pixlo_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixlo_user -d pixlo_newsletter_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pixlo_newsletter_redis
    restart: unless-stopped
    ports:
      - "6385:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
