version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixlo_news_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pixlo_news_db}
    ports:
      - "5433:5432"
    volumes:
      - pixlo_news_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pixlo_news_redis
    restart: always
    ports:
      - "6383:6379"
    volumes:
      - pixlo_news_redis_data:/data

volumes:
  pixlo_news_postgres_data:
  pixlo_news_redis_data:
