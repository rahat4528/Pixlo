version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixlo_recipes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixlo_user
      POSTGRES_PASSWORD: pixlo_password
      POSTGRES_DB: pixlo_recipes_db
    ports:
      - "5432:5432"
    volumes:
      - recipes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixlo_user -d pixlo_recipes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pixlo_recipes_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - recipes_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pixlo_recipes_storage
    restart: unless-stopped
    command: server /data --console-address ":9004"
    environment:
      MINIO_ROOT_USER: pixlo_minio_admin
      MINIO_ROOT_PASSWORD: pixlo_minio_secret_key
    ports:
      - "9003:9000"
      - "9004:9002"
    volumes:
      - recipes_miniodata:/data

volumes:
  recipes_pgdata:
  recipes_redisdata:
  recipes_miniodata:
